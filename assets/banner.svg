<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a051b" />
      <stop offset="50%" stop-color="#0f0c2e" />
      <stop offset="100%" stop-color="#05020c" />
    </linearGradient>

    <!-- Path Gradients -->
    <linearGradient id="chosenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    
    <linearGradient id="rejectedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0844" />
      <stop offset="100%" stop-color="#ffb199" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7f00ff" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#e100ff" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <style>
    /* CSS Animation for SVG elements */
    @keyframes pulse {
      0% { r: 6px; opacity: 0.6; }
      50% { r: 12px; opacity: 1; filter: drop-shadow(0 0 8px #00f2fe); }
      100% { r: 6px; opacity: 0.6; }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }
    @keyframes draw {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes glowText {
      0% { text-shadow: 0 0 5px rgba(255, 255, 255, 0.2); }
      50% { text-shadow: 0 0 20px rgba(79, 172, 254, 0.6), 0 0 30px rgba(0, 242, 254, 0.4); }
      100% { text-shadow: 0 0 5px rgba(255, 255, 255, 0.2); }
    }

    .bg { fill: url(#bgGrad); }
    .pulse-node { animation: pulse 3s infinite ease-in-out; }
    .float-container { animation: float 6s infinite ease-in-out; }
    .path-chosen {
      stroke: url(#chosenGrad);
      stroke-width: 4;
      fill: none;
      stroke-dasharray: 600;
      animation: draw 4s infinite linear;
    }
    .path-rejected {
      stroke: url(#rejectedGrad);
      stroke-width: 2;
      stroke-dasharray: 8, 8;
      fill: none;
      opacity: 0.5;
    }
    .title-text {
      font-family: 'Outfit', 'Inter', system-ui, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #ffffff;
      animation: glowText 4s infinite ease-in-out;
    }
    .subtitle-text {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 18px;
      fill: #a0aec0;
      letter-spacing: 1px;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" />

  <!-- Animated Design Elements -->
  <g class="float-container">
    <!-- Grid decorative background -->
    <path d="M 0,100 L 1200,100 M 0,200 L 1200,200 M 0,300 L 1200,300 M 200,0 L 200,400 M 400,0 L 400,400 M 600,0 L 600,400 M 800,0 L 800,400 M 1000,0 L 1000,400" stroke="#1d1845" stroke-width="0.5" />

    <!-- Source Node -->
    <circle cx="150" cy="200" r="10" fill="#7f00ff" />
    <circle cx="150" cy="200" r="18" fill="none" stroke="#7f00ff" stroke-width="1" opacity="0.5" />

    <!-- Divergence Paths -->
    <!-- Chosen Path (Wins) -->
    <path d="M 150,200 C 300,100 500,80 850,80" class="path-chosen" />
    <!-- Rejected Path (Loses) -->
    <path d="M 150,200 C 300,300 500,320 850,320" class="path-rejected" />

    <!-- Endpoint Nodes -->
    <!-- Chosen target -->
    <circle cx="850" cy="80" r="6" fill="#00f2fe" class="pulse-node" />
    <text x="870" y="85" font-family="'Inter', sans-serif" font-size="14" fill="#00f2fe" font-weight="bold">y_w (Chosen)</text>

    <!-- Rejected target -->
    <circle cx="850" cy="320" r="5" fill="#ff0844" />
    <text x="870" y="325" font-family="'Inter', sans-serif" font-size="14" fill="#ff0844" opacity="0.7">y_l (Rejected)</text>
    
    <!-- Decoupled Preference Space -->
    <path d="M 150,200 L 850,200" stroke="#7f00ff" stroke-width="1" stroke-dasharray="4, 10" opacity="0.3" />
    <circle cx="500" cy="200" r="4" fill="#7f00ff" opacity="0.4" />
    <text x="515" y="205" font-family="'Inter', sans-serif" font-size="12" fill="#7f00ff" opacity="0.5">Implicit Reward Space</text>
  </g>

  <!-- Banner Texts -->
  <g transform="translate(250, 0)">
    <text x="50" y="170" class="title-text">Awesome DPO</text>
    <text x="50" y="210" class="subtitle-text">Direct Preference Optimization Evolution &amp; Variants</text>
  </g>
</svg>
